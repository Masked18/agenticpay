services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d test']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  integration-tests:
    image: node:20-alpine
    working_dir: /workspace/backend
    volumes:
      - .:/workspace
      - integration-node-modules:/workspace/node_modules
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@postgres:5432/test
      REDIS_URL: redis://redis:6379
    command: sh -c "cd /workspace && npm install --ignore-scripts && npm --workspace backend run db:generate && npm --workspace backend run test:integration"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  integration-node-modules: